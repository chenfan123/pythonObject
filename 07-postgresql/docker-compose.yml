services:
  postgres:
    image: postgres:17-alpine
    container_name: learn-postgres
    restart: unless-stopped
    ports:
      # 本机 5432 常被其他容器占用，学习库映射到 5433
      - "5433:5432"
    environment:
      POSTGRES_USER: learn
      POSTGRES_PASSWORD: learn
      POSTGRES_DB: learn_db
    volumes:
      - learn_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learn -d learn_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_test:
    image: postgres:17-alpine
    container_name: learn-postgres-test
    profiles: ["test"]
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: learn
      POSTGRES_PASSWORD: learn
      POSTGRES_DB: learn_test_db
    volumes:
      - learn_pg_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learn -d learn_test_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  learn_pg_data:
  learn_pg_test_data:
