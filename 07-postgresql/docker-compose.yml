services:
  postgres:
    image: postgres:17-alpine
    container_name: learn-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: learn
      POSTGRES_PASSWORD: learn
      POSTGRES_DB: learn_db
    volumes:
      - learn_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learn -d learn_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  learn_pg_data:
